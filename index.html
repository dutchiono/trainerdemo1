.tourmask{position:fixed;inset:0;background:#000b;z-index:20}.tourfocus{position:relative!important;z-index:22!important;box-shadow:0 0 0 5px #c5e7a5!important;border-radius:10px;background:#26382b!important}.tourbox{position:fixed;z-index:23;bottom:22px;left:50%;transform:translateX(-50%);width:min(450px,calc(100% - 28px));padding:23px;border-radius:15px;background:#d5ebc8;color:#142019;box-shadow:0 20px 80px #0009}.tourbox p{color:#314c37}.tourbox button{margin-right:8px}.feedbackvideo{width:100%;max-height:360px;border-radius:10px;background:#090e0b}.recording{color:#ffaaa0;font-weight:700}.demo-toolbar{min-height:67px;padding:12px max(18px,calc((100vw - 1200px)/2));background:#26382b;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid #52674d}.demo-meta{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.1em}.demo-dot{height:8px;width:8px;border-radius:50%;background:#b9ed9c}.demo-sub{color:#bacbbb;letter-spacing:0}.demo-switch{display:flex;padding:4px;background:#101b14;border:1px solid #536a50;border-radius:12px;gap:3px}.demo-switch button{border:0;background:transparent;color:#a7b9aa;border-radius:8px;padding:10px 22px;font-weight:700}.demo-switch button.selected{background:#c5e7a5;color:#142017}.app-header{top:0}.app-head-right{display:flex;align-items:center;gap:12px}.app-context{font-size:11px;color:#a8b6aa;letter-spacing:.12em}.avatar{width:36px;height:36px;display:grid;place-items:center;background:#334b39;border-radius:50%;color:#e1f2d8;font-weight:700}.demo-toolbar button:focus-visible,.hamb:focus-visible{outline:2px solid white;outline-offset:2px}@media(max-width:650px){.demo-toolbar{padding:10px 14px;gap:8px}.demo-meta{font-size:10px}.demo-sub{display:none}.demo-switch button{padding:9px 15px}.app-context{display:none}} .help-fab{position:fixed;right:20px;bottom:20px;z-index:18;border:1px solid #7b9b70;background:#c5e7a5;color:#132018;width:54px;height:54px;border-radius:50%;font-size:27px;font-weight:800;box-shadow:0 8px 30px #0008}.help-pop{position:fixed;right:20px;bottom:84px;z-index:18;width:min(310px,calc(100vw - 40px));background:#24342a;border:1px solid #64805c;border-radius:15px;padding:18px;box-shadow:0 15px 45px #0009}.help-pop button{width:100%;text-align:left;margin-top:8px}.tourbox{max-height:55vh;overflow-y:auto}.tourfocus{pointer-events:none}@media(max-width:600px){.help-fab{right:15px;bottom:15px}.help-pop{right:15px;bottom:78px}} .quote-layout{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.quote-layout input,.quote-layout select{width:100%}.quote-layout label{display:block;margin-top:12px}.quote-total{font-size:36px;font-weight:800;color:var(--accent)}.quote-small{font-size:12px;color:var(--muted)}.quote-table{width:100%;border-collapse:collapse}.quote-table td{padding:10px;border-bottom:1px solid var(--line)}.quote-table td:last-child{text-align:right}.quote-actions{display:flex;gap:10px;flex-wrap:wrap}@media print{header,.demo-toolbar,aside,#shade,.help-fab,.help-pop,.quote-actions,nav{display:none!important}main{max-width:none;padding:0}body{background:white;color:black}.card{background:white;color:black;border:1px solid #ddd}p,.quote-small{color:#444}.quote-total{color:black}} .cost-scroll{overflow-x:auto}.cost-table{width:100%;border-collapse:collapse;min-width:900px}.cost-table th,.cost-table td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.cost-table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.cost-table input:not([type=checkbox]),.cost-table select{background:#101712;border:1px solid #35493b;border-radius:7px;padding:8px;color:var(--ink);width:100%;min-width:65px}.cost-table td:nth-child(2){min-width:170px}.cost-table td:nth-child(3){min-width:190px}.cost-table input[type=checkbox]{width:19px;height:19px;accent-color:#c5e7a5}.cost-group{display:block;color:var(--accent);font-size:10px;text-transform:upperca ttom:18px}.customer-bid .bid-foot{padding:0 4px 32px}@media(max-width:560px){.bid-top{display:block}.bid-status{text-align:left;margin-top:14px}.bid-table td:last-child{font-size:12px}} </style></head><body>
<div class="demo-toolbar"><div class="demo-meta"><span class="demo-dot"></span><strong>INTERACTIVE DEMO</strong><span class="demo-sub">Choose an experience</span></div><div class="demo-switch" role="group" aria-label="Demo experience"><button id="trainer-switch" onclick="demoRole('coach')">Trainer</button><button id="client-switch" onclick="demoRole('athlete')">Client</button></div><select id="role" aria-label="Current demo role" hidden><option value="coach">Trainer</option><option value="athlete">Client</option></select></div><header class="app-header"><div class="topright"><button class="hamb" aria-label="Open navigation" onclick="drawer(true)">☰</button><div class="brand">Coaching Demo</div></div><div class="app-head-right"><span class="app-context" id="context-label">TRAINER WORKSPACE</span><div class="avatar" id="avatar">T</div></div></header>
<div id="shade" onclick="drawer(false)"></div><aside id="drawer"><button class="close" aria-label="Close navigation" onclick="drawer(false)">×</button><div class="brand">Coaching Demo</div><h3 id="navtitle">COACH WORKSPACE</h3><nav id="nav"></nav><p style="margin-top:40px;font-size:12px">A focused coaching workspace.<br>Sample data only.</p></aside><main id="app"></main><div id="tourroot"></div><div id="help-root"></div><footer>COACHING PLATFORM · PRODUCT CONCEPT · NO LIVE BILLING OR ACCOUNTS</footer>
<script>
const initial={clients:[{id:1,name:'Alex Morgan',goal:'Build strength',email:'alex@example.test',training:'4 sessions / week',nutrition:'Protein target: 150g / day',habits:'8,000 steps · 7h sleep',notes:'Working on consistency and progressive overload.'},{id:2,name:'Jordan Lee',goal:'Improve conditioning',email:'jordan@example.test',training:'3 sessions / week',nutrition:'Regular meals, hydration',habits:'Daily walk · Morning routine',notes:'Returning to structured training.'},{id:3,name:'Taylor Brooks',goal:'General fitness',email:'taylor@example.test',training:'2 sessions / week',nutrition:'Increase fruit and vegetables',habits:'Sleep schedule · Weekly meal prep',notes:'New athlete — onboarding pending.'}],checkins:[{id:1,client:1,date:'2026-11-23',weight:'175',sleep:'7',energy:'4',training:'4 of 4',nutrition:'Mostly on plan',wins:'Improved bench press',challenges:'Late meetings',feedback:'Strong week. Keep recovery consistent.'}],onboarding:[],videos:[{id:1,title:'Getting started with your coaching plan',category:'Orientation',description:'How to navigate your plan and what to expect from coaching.'},{id:2,title:'Reading your training sheet',category:'Training',description:'Sets, reps, load, rest periods and logging your sessions.'},{id:3,title:'Nutrition and daily habits',category:'Nutrition',description:'Understanding your targets and habit tracking.'},{id:4,title:'Submitting your weekly check-in',category:'Check-ins',description:'What to report and how coach feedback works.'}]};
let db;try{db=JSON.parse(localStorage.getItem('form-coaching-v2'))||structuredClone(initial)}catch{db=JSON.parse(JSON.stringify(initial))}let page='Welcome',selected=1,sheet='Training',video=1;let welcomeDone=sessionStorage.getItem('form-entered')==='yes';let intakeStep=0;let intakeDraft={};let tourMode='coach';let helpOpen=false;let initialTourPending=!localStorage.getItem('form-tour-demo-seen');let tourStep=-1,recorder=null,chunks=[],recordedBlob=null;db.responses=db.responses||{};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{localStorage.setItem('form-coaching-v2',JSON.stringify(db));render()},coach=()=>$('role').value==='coach';
function drawer(open){$('drawer').classList.toggle('open',open);$('shade').classList.toggle('open',open)}
function navTo(p){page=p;drawer(false);render()}function switchRole(){endTour();page=welcomeDone?(coach()?'Overview':'My plan'):'Welcome';render()}function demoRole(role){endTour(false);$('role').value=role;welcomeDone=true;sessionStorage.setItem('form-entered','yes');page=role==='coach'?'Overview':'My plan';render();if(!localStorage.getItem('form-tour-'+role+'-seen'))setTimeout(()=>startTour(role==='coach'?'coach':'athlete'),150)}
function button(label,fn,cls='alt'){return '<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>'}
function heading(k,t,desc){return '<div class="hero"><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="lead">'+desc+'</p></div>'}
function client(){return db.clients.find(c=>c.id===selected)||db.clients[0]}
function clients(){return heading('01 / CLIENT SHEETS','Your clients. In detail.','Training, nutrition and habits together in a single, editable client record.')+'<div class="card"><h3>Select a client</h3><select onchange="selected=Number(this.value);render()">'+db.clients.map(c=>'<option value="'+c.id+'" '+(selected===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+sheetView()+'<div class="card"><h2>Client check-ins and feedback</h2>'+checkins()+'</div>'+'<div class="card"><h3>Add a client</h3><form onsubmit="addAthlete(event)"><div class="formgrid"><div><label>Name</label><input name="name" required></div><div><label>Email</label><input name="email" type="email" required></div></div><button class="btn" style="margin-top:16px">Add client</button></form></div>'}
function sheetView(){let c=client();return '<div class="card"><div class="eyebrow">CLIENT RECORD</div><h2>'+esc(c.name)+'</h2><p>'+esc(c.goal)+' · '+esc(c.email)+'</p><div class="tabs">'+['Training','Nutrition','Habits','Notes'].map(t=>'<button class="'+(sheet===t?'active':'')+'" onclick="sheet=\''+t+'\';render()">'+t+'</button>').join('')+'</div><form onsubmit="updateSheet(event)"><label>'+sheet+' sheet</label><textarea name="value" rows="6">'+esc(c[sheet.toLowerCase()])+'</textarea><div class="actions"><button class="btn">Save '+sheet.toLowerCase()+'</button></div></form></div>'}
function addAthlete(e){e.preventDefault();let f=new FormData(e.target);let id=Date.now();db.clients.push({id,name:f.get('name'),email:f.get('email'),goal:'New athlete',training:'',nutrition:'',habits:'',notes:''});selected=id;save()}
function updateSheet(e){e.preventDefault();client()[sheet.toLowerCase()]=new FormData(e.target).get('value');save()}
function legacyOnboarding(){return heading('02 / ONBOARDING','Start with the whole picture.','A structured intake that gives the coach the context to build an individual plan.')+'<form class="card" onsubmit="submitOnboarding(event)"><h2>Athlete intake</h2><div class="formgrid"><div><label>Full name</label><input name="name" required></div><div><label>Email</label><input name="email" type="email" required></div><div><label>Primary training goal</label><select name="goal"><option>Build strength</option><option>Fat loss</option><option>Improve conditioning</option><option>General health</option><option>Sport performance</option></select></div><div><label>Training experience</label><select name="experience"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div><label>Days available per week</label><select name="days"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div><label>Typical sleep per night</label><select name="sleep"><option>Under 6 hours</option><option>6–7 hours</option><option>7–8 hours</option><option>8+ hours</option></select></div></div><label>Equipment and gym access</label><textarea name="equipment" placeholder="Gym, home equipment, travel constraints…"></textarea><label>Current nutrition approach</label><textarea name="nutrition" placeholder="Eating pattern, preferences, challenges…"></textarea><label>Injuries, limitations, or anything your coach should consider</label><textarea name="limitations" placeholder="Only share what is relevant to safe training."></textarea><label>What has made consistency difficult?</label><textarea name="barriers"></textarea><div class="actions"><button class="btn">Submit intake</button></div></form>'+(coach()?'<div class="card"><h3>Recent intake submissions</h3>'+ (db.onboarding.length?db.onboarding.map(o=>'<div class="line"><div><b>'+esc(o.name)+'</b><p>'+esc(o.goal)+' · '+esc(o.days)+' days/week</p></div><span class="tag">Received</span></div>').join(''):'<p>No submitted questionnaires yet.</p>')+'</div>':'')}
function submitOnboarding(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=Date.now();db.onboarding.unshift(o);save();alert('Demo questionnaire saved on this device.')}
function responseUI(c){let x=db.responses[c.id];if(!x)return '<p class="muted">No video response yet.</p>';return '<div class="section"><div class="eyebrow">PERSONAL VIDEO RESPONSE</div>'+(x.video?'<video class="feedbackvideo" controls src="'+x.video+'"></video>':'<p class="muted">Video not saved yet</p>')+'<p>'+esc(x.note||'')+'</p></div>'}
function videoResponse(id){let c=db.checkins.find(x=>x.id===id);let x=db.responses[id]||{};let note=prompt('Optional written coaching notes',x.note||'');if(note!==null){db.responses[id]={...x,note};save()} }
function uploadResponse(id,input){let f=input.files[0];if(!f)return;if(f.size>3000000){alert('This local demo can only save very small clips (under 3 MB). Production will use private cloud video storage.');return}let reader=new FileReader();reader.onload=()=>{db.responses[id]={...(db.responses[id]||{}),video:reader.result};try{save()}catch{alert('Browser storage is full. A production backend is needed for larger videos.')}};reader.readAsDataURL(f)}
async function recordResponse(id){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('Camera recording requires HTTPS and a supported browser.');return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:recorder.mimeType});if(blob.size>3000000){alert('Recording too large for local demo storage. Try a shorter clip.');return}let f=new FileReader();f.onload=()=>{db.responses[id]={...(db.responses[id]||{}),video:f.result};try{save()}catch{alert('Not enough local storage for the recording.')}};f.readAsDataURL(blob)};recorder.start();let b=document.getElementById('record-'+id);if(b){b.textContent='Stop recording';b.onclick=()=>{if(recorder?.state==='recording')recorder.stop()}}}catch(e){alert('Camera permission unavailable: '+e.message)}}
function checkins(){return heading('03 / WEEKLY CHECK-INS','The feedback loop.','Athletes report what happened. Coaches respond with context and adjustments.')+'<div class="grid"><div class="card"><h2>Submit a check-in</h2><form onsubmit="submitCheckin(event)">'+(coach()?'<label>Athlete</label><select name="client">'+db.clients.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select>':'<input type="hidden" name="client" value="1">')+'<div class="formgrid"><div><label>Weight (optional, lb)</label><input name="weight" type="number" step=".1"></div><div><label>Average sleep (hours)</label><input name="sleep" type="number" min="0" max="24" step=".5"></div><div><label>Energy (1–5)</label><select name="energy">'+[1,2,3,4,5].map(n=>'<option>'+n+'</option>').join('')+'</select></div><div><label>Training sessions completed</label><input name="training" placeholder="3 of 4"></div></div><label>Nutrition adherence</label><textarea name="nutrition" placeholder="How did nutrition go?"></textarea><label>Wins this week</label><textarea name="wins"></textarea><label>Challenges / questions</label><textarea name="challenges"></textarea><button class="btn">Submit check-in</button></form></div><div class="card"><h2>Check-in history</h2>'+db.checkins.map(c=>'<div class="line"><div><b>'+esc(db.clients.find(x=>x.id===Number(c.client))?.name||'Athlete')+'</b><div class="muted">'+esc(c.date)+' · Training '+esc(c.training)+'</div><p>Win: '+esc(c.wins)+'</p><p>Coach: '+esc(c.feedback||'Awaiting feedback')+'</p>'+(coach()?'<div class="actions"><button class="btn ghost" onclick="feedback('+c.id+')">Written feedback</button><button class="btn ghost" onclick="videoResponse('+c.id+')">Video notes</button><button class="btn ghost" id="record-'+c.id+'" onclick="recordResponse('+c.id+')">Record video</button></div><label>Or upload a response video (small demo clips)</label><input type="file" accept="video/*" onchange="uploadResponse('+c.id+',this)"> </div>':'')+responseUI(c)+'</div></div>').join('')+'</div></div>'}
function submitCheckin(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.id=Date.now();v.date=new Date().toISOString().slice(0,10);v.feedback='';db.checkins.unshift(v);save()}
function feedback(id){let v=prompt('Coach feedback');if(v!==null){db.checkins.find(c=>c.id===id).feedback=v;save()}}
function videos(){return heading('04 / VIDEO GUIDES','Show, don’t just tell.','A guided library for every part of the coaching experience.')+'<div class="note">These are video lesson placeholders. The trainer’s actual walkthrough videos can be embedded here when available; no stock videos are presented as his content.</div><div class="grid">'+db.videos.map(v=>'<div class="card"><div class="video"><div class="play">▶</div></div><div class="eyebrow">'+esc(v.category)+'</div><h3>'+esc(v.title)+'</h3><p>'+esc(v.description)+'</p>'+button('View lesson details','showVideo('+v.id+')','ghost')+'</div>').join('')+'</div>'}
function showVideo(id){let v=db.videos.find(v=>v.id===id);alert(v.title+'\n\n'+v.description+'\n\nVideo upload/embed will be enabled when real trainer content is supplied.')}
function overview(){return heading('COACH HOME','Your coaching workspace','Clients and outstanding work in one place.')+'<div class="grid"><div class="card"><h2>Clients</h2><p>Open a client record to review plans, updates and feedback.</p>'+button('View clients',"navTo('Clients')",'ghost')+'</div><div class="card"><h2>Recent check-ins</h2><p>Review updates as part of your client workflow, not in a separate file library.</p>'+button('Review client updates',"navTo('Clients')",'ghost')+'</div></div>'}
function myPlan(){selected=1;return heading('YOUR COACHING SPACE','Good to see you, Alex.','Your plan, habits and weekly progress in one place.')+'<div class="grid">'+[['Training',client().training],['Nutrition',client().nutrition],['Habits',client().habits]].map(([t,v])=>'<div class="card"><div class="eyebrow">'+t+'</div><h2 style="margin-top:15px">'+esc(v)+'</h2></div>').join('')+'</div><div class="actions">'+button('Complete weekly check-in',"navTo('Check-ins')")+' '+button('View progress',"navTo('Progress')",'ghost')+'</div>'}
const demoTourSteps=[{page:'Welcome',target:'.demo-switch',title:'Explore both experiences',body:'Use Trainer and Client at the top to switch between two complete views of the same coaching app.'},{page:'Welcome',target:'.hamb',title:'Open the app menu',body:'The hamburger opens navigation for the current role. The client and trainer see different tools.'},{page:'Welcome',target:'.help-fab',title:'Help is always here',body:'Tap the question mark anytime to replay the demo tour or launch the tutorial for the current role.'}];const clientTourSteps=[{page:'My plan',target:'.grid .card',title:'Your personal plan',body:'Your training, nutrition and habits live here.'},{page:'Check-ins',target:'form',title:'Your weekly check-in',body:'Tell your coach how the week went. Personal video responses appear with your check-in history.'},{page:'Video guides',target:'.grid .card',title:'Learn at your pace',body:'Watch shared coaching walkthroughs whenever you need them.'}];const tourSteps=[{page:'Overview',target:'.hamb',title:'Navigation',body:'Use this menu to move between client sheets, onboarding, check-ins and video guides.'},{page:'Clients',target:'.card select',title:'Client sheets',body:'Each athlete has individual training, nutrition, habits and coach notes.'},{page:'Onboarding',target:'form.card',title:'Athlete onboarding',body:'A structured questionnaire captures goals, experience and constraints.'},{page:'Check-ins',target:'form',title:'Weekly check-ins',body:'Athletes submit progress; coaches attach private recorded or uploaded video feedback.'},{page:'Video guides',target:'.grid .card',title:'Reusable video guides',body:'Static walkthroughs are shared with all athletes. Personalized check-in videos are separate.'}];
function startTour(mode){helpOpen=false;tourStep=0;tourMode=mode||'coach';if(tourMode==='coach')$('role').value='coach';else $('role').value='athlete';showTour()}
function endTour(mark=true){if(mark&&tourStep>=0)localStorage.setItem('form-tour-'+tourMode+'-seen','yes');tourStep=-1;$('tourroot').innerHTML='';document.querySelectorAll('.tourfocus').forEach(e=>e.classList.remove('tourfocus'))}
function advanceTour(n){tourStep+=n;if(tourStep<0||tourStep>=(tourMode==='demo'?demoTourSteps:tourMode==='athlete'?clientTourSteps:tourSteps).length){endTour();return}showTour()}
function showTour(){if(tourStep<0)return;let steps=tourMode==='athlete'?clientTourSteps:tourSteps;if(tourStep>=steps.length){endTour();return}let t=steps[tourStep];page=t.page;render();document.querySelectorAll('.tourfocus').forEach(e=>e.classList.remove('tourfocus'));let el=document.querySelector(t.target);if(el){el.classList.add('tourfocus');el.scrollIntoView({block:'center',behavior:'smooth'})}$('tourroot').innerHTML='<div class="tourmask"></div><div class="tourbox" role="dialog" aria-modal="true"><div class="eyebrow">GUIDED TOUR · '+(tourStep+1)+' / '+(tourMode==='athlete'?clientTourSteps:tourSteps).length+'</div><h2>'+t.title+'</h2><p>'+t.body+'</p><div class="actions"><button class="btn alt" onclick="advanceTour(-1)">Back</button><button class="btn" onclick="advanceTour(1)">'+(tourStep===(tourMode==='athlete'?clientTourSteps:tourSteps).length-1?'Finish':'Next')+'</button><button class="btn alt" onclick="endTour()">Skip</button></div></div>'}

function enter(role){demoRole(role)}
function beginIntake(){welcomeDone=true;sessionStorage.setItem('form-entered','yes');$('role').value='athlete';page='Onboarding';intakeStep=0;intakeDraft={};render()}
function welcome(){return '<div class="hero" style="padding-top:8vh;max-width:760px"><div class="eyebrow">PERSONAL COACHING, MADE PERSONAL</div><h1>Your coaching.<br>One place.</h1><p class="lead">Training, nutrition, habits, weekly check-ins and direct video feedback from your coach. Everything you need to stay on track.</p><div class="actions">'+button('Get started','beginIntake()')+' '+button('Explore as a client',"enter('athlete')",'ghost')+'</div></div><div class="grid"><div class="card"><div class="eyebrow">FOR CLIENTS</div><h2>Your plan, made for you.</h2><p>Check your training, submit weekly updates and watch your coach’s personal feedback.</p>'+button('Client preview',"enter('athlete')",'alt')+'</div><div class="card"><div class="eyebrow">FOR COACHES</div><h2>Stay close to every client.</h2><p>Manage individual plans, review check-ins and respond with video.</p>'+button('Coach preview',"enter('coach')",'alt')+'</div></div><div class="card"><div class="eyebrow">NEW HERE?</div><h2>See how it works</h2><p>Follow a guided walkthrough of the coaching experience.</p>'+button('Start guided tour','welcomeTour()','ghost')+'</div>'}
function welcomeTour(){startTour('demo')}
const intakeFields=[
{title:'Tell us about yourself',desc:'Start with the basics so your coach knows who you are.',fields:[['Full name','name','text'],['Email address','email','email']]},
{title:'What are you working toward?',desc:'Your goals shape your coaching plan.',fields:[['Primary training goal','goal','select','Build strength|Fat loss|Improve conditioning|General health|Sport performance'],['Training experience','experience','select','Beginner|Intermediate|Advanced'],['Training days per week','days','select','2|3|4|5|6']]},
{title:'Your routine',desc:'A plan should fit your actual life.',fields:[['Equipment and gym access','equipment','textarea'],['Current nutrition approach','nutrition','textarea'],['Typical sleep','sleep','select','Under 6 hours|6–7 hours|7–8 hours|8+ hours']]},
{title:'Anything else your coach should know?',desc:'Share what matters to your training.',fields:[['Injuries or limitations','limitations','textarea'],['What makes consistency difficult?','barriers','textarea']]}
];
function onboarding(){let t=intakeFields[intakeStep];return heading('CLIENT ONBOARDING','Let’s get to know you.','A short guided intake, one step at a time.')+'<div class="card"><div class="eyebrow">STEP '+(intakeStep+1)+' OF '+intakeFields.length+'</div><div class="bar" style="margin:14px 0 25px"><i style="width:'+((intakeStep+1)/intakeFields.length*100)+'%"></i></div><h2>'+t.title+'</h2><p>'+t.desc+'</p><form onsubmit="nextIntake(event)">'+t.fields.map(([label,name,type,options])=>'<label>'+label+'</label>'+(type==='textarea'?'<textarea name="'+name+'">'+esc(intakeDraft[name]||'')+'</textarea>':type==='select'?'<select name="'+name+'">'+options.split('|').map(o=>'<option '+(intakeDraft[name]===o?'selected':'')+'>'+o+'</option>').join('')+'</select>':'<input name="'+name+'" type="'+type+'" value="'+esc(intakeDraft[name]||'')+'" '+(name==='name'||name==='email'?'required':'')+'>')).join('')+'<div class="actions">'+(intakeStep?button('Back','backIntake()','alt'):'')+'<button class="btn" type="submit">'+(intakeStep===intakeFields.length-1?'Finish onboarding':'Continue')+'</button></div></form></div>'}
function nextIntake(e){e.preventDefault();Object.assign(intakeDraft,Object.fromEntries(new FormData(e.target)));if(intakeStep<intakeFields.length-1){intakeStep++;render()}else{db.onboarding.unshift({...intakeDraft,id:Date.now()});save();page='Onboarding complete';render()}}
function backIntake(){intakeStep=Math.max(0,intakeStep-1);render()}
function onboardingComplete(){return heading('YOU’RE ALL SET','Welcome to your coaching space.','Your intake is saved in this demo. Next, explore your plan and learn how to use the app.')+'<div class="card"><h2>Start with a quick tour</h2><p>We’ll show you where to find your training, check-ins and video feedback.</p><div class="actions">'+button('Take the tour','clientTour()')+' '+button('Go to my plan',"navTo('My plan')",'ghost')+'</div></div>'}
function clientTour(){page='My plan';startTour('athlete')}
const quoteDefaults={client:'Coaching platform prospect',project:'Personal coaching PWA + CRM',build:1800,designHours:4,designRate:100,hosting:5,term:12,domain:0,setup:0,notes:'Includes client portal, coach dashboard, intake questionnaire, weekly check-ins, video library and personal video feedback. Scope and acceptance criteria must be approved before fixed-price work begins.'};
let quoteData={...quoteDefaults,...JSON.parse(localStorage.getItem('miono-quote-draft')||'{}')};
function quoteSet(k,v){quoteData[k]=['build','designHours','designRate','hosting','term','domain','setup'].includes(k)?Math.max(0,Number(v)||0):v;localStorage.setItem('miono-quote-draft',JSON.stringify(quoteData));renderQuoteTotals()}
function quoteMoney(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n)}
function quoteTotals(){let q=quoteData;return {build:q.build,design:q.designHours*q.designRate,setup:q.setup,hosting:q.hosting*q.term,domain:q.domain,total:q.build+q.designHours*q.designRate+q.setup+q.hosting*q.term+q.domain}}
function renderQuoteTotals(){let e=$('quote-totals');if(!e)return;let q=quoteData,t=quoteTotals();e.innerHTML='<div class="eyebrow">ESTIMATED INITIAL COMMITMENT</div><div class="quote-total">'+quoteMoney(t.total)+'</div><table class="quote-table"><tr><td>Fixed functional build</td><td>'+quoteMoney(t.build)+'</td></tr><tr><td>Design allowance ('+q.designHours+' hrs × '+quoteMoney(q.designRate)+')</td><td>'+quoteMoney(t.design)+'</td></tr><tr><td>One-time setup</td><td>'+quoteMoney(t.setup)+'</td></tr><tr><td>Hosting ('+q.term+' months × '+quoteMoney(q.hosting)+')</td><td>'+quoteMoney(t.hosting)+'</td></tr><tr><td>Domain allowance (actual cost varies)</td><td>'+quoteMoney(t.domain)+'</td></tr></table><p class="quote-small">Estimate only. Taxes, payment processor fees, third-party services, excess storage and bandwidth excluded unless specified. Hosting is not an uptime SLA.</p>'}
function quote(){let q=quoteData;let fields=[['client','Client / business','text'],['project','Project','text'],['build','Fixed functional build ($)','number'],['designHours','Design allowance (hours)','number'],['designRate','Design rate ($/hour)','number'],['setup','One-time setup ($)','number'],['hosting','Monthly hosting ($)','number'],['term','Hosting term (months)','number'],['domain','Domain allowance ($)','number']];return heading('MIONO · ESTIMATING','Project proposal & costs','A reusable bid worksheet. Illustrative values only; adjust and approve before sending.')+'<div class="quote-layout"><div class="card"><h2>Configure the bid</h2>'+fields.map(([k,label,type])=>'<label>'+label+'</label><input type="'+type+'" '+(type==='number'?'min="0" step="any"':'')+' value="'+esc(String(q[k]))+'" oninput="quoteSet(\''+k+'\',this.value)">').join('')+'<label>Scope & assumptions</label><textarea rows="7" oninput="quoteSet(\'notes\',this.value)">'+esc(q.notes)+'</textarea></div><div class="card"><h2>Price breakdown</h2><div id="quote-totals"></div><div class="quote-actions"><button class="btn" onclick="window.print()">Print / save PDF</button><button class="btn alt" onclick="copyQuote()">Copy proposal</button><button class="btn ghost" onclick="resetQuote()">Reset</button></div></div></div><div class="card"><h2>Terms to confirm</h2><p><b>Function:</b> Fixed scope and acceptance tests; defects against accepted scope corrected without extra labor charges.</p><p><b>Form:</b> Design and content revisions draw from the allowance. Additional work billed at the agreed hourly rate, in 15-minute increments. Clarified, reproducible defects are not design changes.</p><p><b>Operations:</b> Domain is purchased separately at actual registrar cost. Hosting covers the agreed baseline; storage, video delivery, backups, support and third-party costs require explicit limits. Monthly and annual billing are options, not different deliverables.</p><p><b>Approval:</b> This estimate is not a contract or invoice. Milestones, payment schedule, ownership, support, cancellation, privacy, and final scope must be confirmed in a signed agreement.</p></div>'}
function copyQuote(){let q=quoteData,t=quoteTotals();let message='MIONO PROJECT ESTIMATE\\nClient: '+q.client+'\\nProject: '+q.project+'\\n\\nFixed functional build: '+quoteMoney(t.build)+'\\nDesign allowance: '+q.designHours+' hours at '+quoteMoney(q.designRate)+'/hour = '+quoteMoney(t.design)+'\\nSetup: '+quoteMoney(t.setup)+'\\nHosting: '+quoteMoney(q.hosting)+'/month × '+q.term+' months = '+quoteMoney(t.hosting)+'\\nDomain allowance: '+quoteMoney(t.domain)+' (actual cost)\\nEstimated commitment: '+quoteMoney(t.total)+'\\n\\nScope: '+q.notes+'\\n\\nFunction is fixed to approved acceptance criteria. Subjective design changes beyond the allowance are billed in 15-minute increments. Domain, overages and third-party fees are separate. Subject to final agreement.';navigator.clipboard.writeText(message).then(()=>alert('Proposal copied')).catch(()=>alert('Clipboard unavailable; use Print / save PDF'))}
function resetQuote(){quoteData={...quoteDefaults};localStorage.removeItem('miono-quote-draft');render()}

const optionDefaults=[
{id:'hosting',group:'Hosting',name:'PWA website + database',detail:'Basic hosting',unit:'month',price:5,qty:12,selected:true},
{id:'domain',group:'Domain',name:'Custom domain',detail:'Choose a domain; registrar pricing varies',unit:'year',price:15,qty:1,selected:false},
{id:'email',group:'Communication',name:'Custom business email',detail:'Optional mailbox',unit:'month',price:0,qty:12,selected:false},
{id:'storage',group:'Storage',name:'Additional file storage',detail:'Only if needed',unit:'month',price:0,qty:12,selected:false},
{id:'media',group:'Media',name:'Video hosting / delivery',detail:'Optional — not required',unit:'month',price:0,qty:12,selected:false},
{id:'support',group:'Service',name:'Ongoing updates / maintenance',detail:'Optional support arrangement',unit:'month',price:0,qty:12,selected:false},
{id:'build',group:'Build',name:'Website + backend build',detail:'Fixed scope, price set after requirements',unit:'once',price:0,qty:1,selected:true},
{id:'design',group:'Design',name:'Visual design / revision allowance',detail:'15-minute increments; editable rate and hours',unit:'hour',price:100,qty:0,selected:false}
];
let costOptions=(()=>{try{let a=JSON.parse(localStorage.getItem('miono-cost-options'));return Array.isArray(a)&&a.length?a:optionDefaults.map(x=>({...x}))}catch{return optionDefaults.map(x=>({...x}))}})();
function optionSave(){localStorage.setItem('miono-cost-options',JSON.stringify(costOptions))}
function optionEdit(i,k,v){let o=costOptions[i];if(!o)return;o[k]=k==='selected'?!!v:['price','qty'].includes(k)?Math.max(0,Number(v)||0):v;optionSave();drawOptionsSummary()}
function optionAdd(){costOptions.push({id:'custom-'+Date.now(),group:'Other',name:'New option',detail:'',unit:'once',price:0,qty:1,selected:false});optionSave();render()}
function optionRemove(i){costOptions.splice(i,1);optionSave();render()}
function optionReset(){costOptions=optionDefaults.map(x=>({...x}));optionSave();render()}
function optionAnnual(){costOptions.forEach(o=>{if(o.unit==='month')o.qty=12});optionSave();render()}
function optionMonthly(){costOptions.forEach(o=>{if(o.unit==='month')o.qty=1});optionSave();render()}
function optionTotal(){return costOptions.reduce((a,o)=>a+(o.selected?o.price*o.qty:0),0)}
function drawOptionsSummary(){let e=$('options-summary');if(!e)return;let selected=costOptions.filter(o=>o.selected);e.innerHTML='<div class="eyebrow">SELECTED OPTIONS</div><div class="quote-total">'+quoteMoney(optionTotal())+'</div><p class="quote-small">Total for quantities shown; recurring items are multiplied by selected months/years.</p>'+selected.map(o=>'<div class="option-summary-row"><span>'+esc(o.name)+' <small>('+o.qty+' × '+esc(o.unit)+')</small></span><strong>'+quoteMoney(o.qty*o.price)+'</strong></div>').join('')+'<div class="quote-actions"><button class="btn" onclick="window.print()">Print this sheet</button><button class="btn alt" onclick="copyOptions()">Copy selected options</button></div>'}
function copyOptions(){let lines=['MIONO · COST OPTIONS','',...costOptions.filter(o=>o.selected).map(o=>o.name+' — '+o.qty+' × '+quoteMoney(o.price)+' / '+o.unit+' = '+quoteMoney(o.qty*o.price)),'','TOTAL: '+quoteMoney(optionTotal()),'','Optional items can be added or removed. Domain prices are estimates until purchased.'];navigator.clipboard.writeText(lines.join('\n')).then(()=>alert('Options copied')).catch(()=>alert('Clipboard unavailable'))}
function costSheet(){return '<section class="customer-bid"><div class="bid-top"><div><div class="eyebrow">MIONO · PROJECT PROPOSAL</div><h1>Coaching platform</h1><p class="lead">A private coaching app for your clients, with a dedicated workspace for your team.</p></div><div class="bid-status">PROJECT ESTIMATE<br><small>Prepared for discussion</small></div></div>'+
'<div class="bid-intro"><strong>What you have seen</strong><p>The working prototype demonstrates the experience. The finished product will include real accounts, stored client data, and the features agreed in the final project scope.</p></div>'+
'<div class="card"><div class="eyebrow">01 / INITIAL PROJECT</div><h2>Development and launch</h2><table class="bid-table"><thead><tr><th>Item</th><th>Included work</th><th>Price</th></tr></thead><tbody>'+
'<tr><td><strong>Client application</strong></td><td>Onboarding, training plans, nutrition, habits, progress and check-ins</td><td>Included in build</td></tr>'+
'<tr><td><strong>Coach application</strong></td><td>Client records, programming, check-in review, guidance and feedback</td><td>Included in build</td></tr>'+
'<tr><td><strong>Accounts and backend</strong></td><td>Secure sign-in, database, permissions, hosting configuration and testing</td><td>Included in build</td></tr>'+
'<tr><td><strong>Launch</strong></td><td>Deployment, agreed refinements and corrections to the approved functionality</td><td>Included in build</td></tr>'+
'<tr class="bid-total"><td colspan="2"><strong>One-time project price</strong><small>Final amount set against the agreed feature scope before development</small></td><td><strong>Fixed quote pending</strong></td></tr></tbody></table></div>'+
'<div class="card"><div class="eyebrow">02 / OPTIONS</div><h2>Available choices</h2><table class="bid-table"><thead><tr><th>Option</th><th>What changes</th><th>Cost</th></tr></thead><tbody>'+
'<tr><td><strong>Website and app</strong></td><td>Mobile-friendly web app accessible from a browser and installable on supported devices</td><td>Included in build</td></tr>'+
'<tr><td><strong>Custom domain</strong></td><td>Your chosen website address; cost varies by name and extension</td><td>At registrar cost</td></tr>'+
'<tr><td><strong>Branded business email</strong></td><td>Email addresses at your domain, if wanted</td><td>Optional · provider price</td></tr>'+
'<tr><td><strong>Additional features</strong></td><td>Integrations, payments, advanced reporting or other features beyond the agreed build</td><td>Quoted separately</td></tr>'+
'<tr><td><strong>Future design changes</strong></td><td>New visual directions or changes requested after the design is approved</td><td>Quoted for the work requested</td></tr></tbody></table></div>'+
'<div class="card"><div class="eyebrow">03 / OPERATING COST</div><h2>Simple monthly hosting</h2><div class="bid-figures"><div><span class="bid-number">$5<small>/month</small></span><p>Website, app and database hosting</p></div><div><span class="bid-number">$60<small>/year</small></span><p>Twelve months of hosting</p></div><div><span class="bid-number">+ domain</span><p>Only the domain you choose, at its actual price</p></div></div><p class="bid-note">The hosting figure assumes the small-scale usage discussed for this project. Any change in infrastructure requirements would be agreed before adding expense.</p></div>'+
'<div class="card bid-highlight"><div class="eyebrow">HOW THE PROJECT WORKS</div><h2>Clear scope. Clear price.</h2><p>The prototype and initial conversation are complimentary. The next step is a paid project-definition phase to confirm exactly what will be built, followed by a written fixed-price development agreement. The project-definition fee is credited toward the build if you proceed.</p><p>Development begins once the scope, price and first payment milestone are approved. Work that fails to meet the agreed specification is corrected as part of the build. Requested additions or changes are priced and approved separately.</p></div>'+
'<p class="bid-foot">This is a preliminary itemized proposal, not a binding final quotation. No initial build price or domain cost has been agreed yet.</p></section>'}
function customerProposal(){return heading('MIONO · DEVELOPMENT PROPOSAL','Your coaching platform, built for your business.','A practical path from the demonstrated concept to a working product.')+
'<div class="card"><div class="eyebrow">THE PRODUCT</div><h2>One platform. Two experiences.</h2><p><strong>For your coaching team:</strong> manage clients, training, nutrition, habits, progress and individual feedback from a single workspace.</p><p><strong>For your clients:</strong> complete onboarding, follow their plans, submit updates and receive guidance without navigating a collection of separate tools.</p></div>'+

function render(){document.getElementById('trainer-switch').classList.toggle('selected',coach());document.getElementById('client-switch').classList.toggle('selected',!coach());document.getElementById('context-label').textContent=coach()?'TRAINER WORKSPACE':'CLIENT WORKSPACE';document.getElementById('avatar').textContent=coach()?'T':'C';if(!welcomeDone&&page!=='Onboarding'&&page!=='Onboarding complete')page='Welcome';let pages=coach()?['Overview','Clients','Project costs','Proposal']:['My plan','Progress','Settings'];if(page==='Bid & costs')page='Project costs';if(!pages.includes(page))page=pages[0];$('navtitle').textContent=coach()?'COACH WORKSPACE':'ATHLETE WORKSPACE';$('nav').innerHTML=pages.map(p=>'<button class="'+(p===page?'active':'')+'" onclick="navTo(\''+p+'\')">'+p+'</button>').join('');$('app').innerHTML=({Welcome:welcome,'Onboarding complete':onboardingComplete,Overview:overview,Clients:clients,'Project costs':costSheet,Proposal:customerProposal,Progress:()=>heading('YOUR PROGRESS','Progress and check-ins','Your recent updates and feedback.')+checkins(),Settings:()=>heading('YOUR ACCOUNT','Settings','Account preferences for the client experience.'),Onboarding:onboarding,'Check-ins':checkins,'Video guides':videos,'My plan':myPlan,Tutorial:()=>''}[page])();renderHelp()}function renderHelp(){$('help-root').innerHTML='<button class="help-fab" aria-label="Help and tutorials" aria-expanded="'+helpOpen+'" onclick="helpOpen=!helpOpen;renderHelp()">?</button>'+(helpOpen?'<div class="help-pop"><h3>Need a hand?</h3><p>Choose a walkthrough.</p><button class="btn alt" onclick="startTour(\'demo\')">Tour the demo</button><button class="btn alt" onclick="startTour(\''+(coach()?'coach':'athlete')+'\')">'+(coach()?'Trainer':'Client')+' app tutorial</button><button class="btn ghost" onclick="helpOpen=false;renderHelp()">Close</button></div>':'')}render();if(initialTourPending){initialTourPending=false;setTimeout(()=>{if(!localStorage.getItem('form-tour-demo-seen'))startTour('demo')},350)}
</script></body></html>
