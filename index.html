<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251c"><title>FORM Coaching Studio</title><style>body{margin:0;background:#0d1713;color:#eaf4ed;font:15px system-ui}header{padding:22px;background:#13281e;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}button,input,select,textarea{font:inherit;border-radius:9px;padding:10px;border:1px solid #385b47}button{background:#b8f0be;color:#102018;cursor:pointer;font-weight:650}button.secondary{background:#203c2b;color:#d9f3df}main{max-width:1080px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#172b20;border:1px solid #34503d;border-radius:16px;padding:20px;margin:12px 0}.muted{color:#a8c1ad}.stat{font-size:32px;font-weight:750}.nav{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #34503d;padding:12px 0}input,select,textarea{background:#0f1d16;color:white;max-width:100%;box-sizing:border-box}label{display:block;margin:10px 0}.pill{padding:5px 10px;border-radius:20px;background:#315b3c;color:#c8f9d0;font-size:12px}#notice{color:#c7efcc}</style></head><body><header><div><h1>FORM / Coaching Studio</h1><small class="muted">ONE-ON-ONE COACHING · INTERACTIVE DEMO</small></div><select id="role" onchange="render()"><option value="coach">Coach admin</option><option value="athlete">Athlete app</option></select></header><main><div id="nav" class="nav"></div><div id="app"></div><p id="notice"></p><small class="muted">Fictional demo data. No real accounts, billing, or client information.</small></main><script>const seed={clients:[{id:1,name:'Alex Morgan',email:'alex@example.test',goal:'Strength',status:'Active',paid:true},{id:2,name:'Jordan Lee',email:'jordan@example.test',goal:'Conditioning',status:'Active',paid:true},{id:3,name:'Taylor Brooks',email:'taylor@example.test',goal:'General fitness',status:'Onboarding',paid:false}],workouts:[{id:1,client:1,day:'Tuesday',name:'Upper Body Strength',exercises:'Bench press 4×8; Incline DB press 3×10; Cable row 3×12',done:false},{id:2,client:1,day:'Thursday',name:'Lower Body Strength',exercises:'Squat 4×6; Romanian deadlift 3×10; Lunges 3×12',done:false},{id:3,client:2,day:'Wednesday',name:'Conditioning Circuit',exercises:'Bike 15 min; Kettlebell swings 4×12; Row 10 min',done:false}],messages:[{who:'Coach',text:'Welcome! Your program is ready.'}]};let data;try{data=JSON.parse(localStorage.getItem('form-demo'))||seed}catch{data=seed}let page='Dashboard';function save(){localStorage.setItem('form-demo',JSON.stringify(data));render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){page=p;render()}function addClient(e){e.preventDefault();let f=new FormData(e.target);data.clients.push({id:Date.now(),name:f.get('name'),email:f.get('email'),goal:f.get('goal'),status:'Onboarding',paid:false});save()}function assign(e){e.preventDefault();let f=new FormData(e.target);data.workouts.push({id:Date.now(),client:Number(f.get('client')),day:f.get('day'),name:f.get('name'),exercises:f.get('exercises'),done:false});save()}function togglePaid(id){let c=data.clients.find(c=>c.id===id);c.paid=!c.paid;save()}function complete(id){let w=data.workouts.find(w=>w.id===id);w.done=!w.done;save()}function message(e){e.preventDefault();let v=e.target.elements.msg.value.trim();if(v){data.messages.push({who:document.getElementById('role').value==='coach'?'Coach':'Alex',text:v});save()}}function render(){let coach=document.getElementById('role').value==='coach';let pages=coach?['Dashboard','Athletes','Programs','Billing','Messages']:['Home','My workouts','Progress','Messages','Membership'];if(!pages.includes(page))page=pages[0];document.getElementById('nav').innerHTML=pages.map(p=>'<button class="'+(p===page?'':'secondary')+'" onclick="go(\''+p+'\')">'+p+'</button>').join('');let a='';if(page==='Dashboard')a='<h2>Coach overview</h2><div class="grid">'+[['Athletes',data.clients.length],['Active',data.clients.filter(c=>c.status==='Active').length],['Workouts',data.workouts.length],['Completed',data.workouts.filter(w=>w.done).length]].map(([k,v])=>'<div class="card"><div class="stat">'+v+'</div><span class="muted">'+k+'</span></div>').join('')+'</div><div class="card"><h3>Recent athletes</h3>'+data.clients.map(c=>'<div class="row">'+esc(c.name)+' <span class="pill">'+esc(c.status)+'</span></div>').join('')+'</div>';if(page==='Athletes')a='<h2>Athlete directory</h2><div class="card">'+data.clients.map(c=>'<div class="row"><div><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.goal)+' · '+esc(c.email)+'</div></div><span class="pill">'+esc(c.status)+'</span></div>').join('')+'</div><div class="card"><h3>Add athlete</h3><form onsubmit="addClient(event)"><label>Name <input name="name" required></label><label>Email <input name="email" type="email" required></label><label>Goal <input name="goal" required></label><button>Add athlete</button></form></div>';if(page==='Programs')a='<h2>Workout assignments</h2>'+data.workouts.map(w=>'<div class="card"><b>'+esc(w.name)+'</b><p class="muted">'+esc(data.clients.find(c=>c.id===w.client)?.name||'Unknown')+' · '+esc(w.day)+'</p><p>'+esc(w.exercises)+'</p><span class="pill">'+(w.done?'Completed':'Scheduled')+'</span></div>').join('')+'<div class="card"><h3>Assign workout</h3><form onsubmit="assign(event)"><label>Athlete <select name="client">'+data.clients.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></label><label>Day <select name="day">'+['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=>'<option>'+d+'</option>').join('')+'</select></label><label>Workout name <input name="name" required></label><label>Exercises <textarea name="exercises" required></textarea></label><button>Assign workout</button></form></div>';if(page==='Billing')a='<h2>Billing tracker</h2><p class="muted">Manual demo status only. Stripe is not connected.</p>'+data.clients.map(c=>'<div class="card row"><div><b>'+esc(c.name)+'</b><p class="muted">'+(c.paid?'Paid':'Unpaid / complimentary')+'</p></div><button onclick="togglePaid('+c.id+')">Mark '+(c.paid?'unpaid':'paid')+'</button></div>').join('');if(page==='Home')a='<h2>Welcome back, Alex</h2><div class="card"><h3>Your coaching hub</h3><p>Personalized workouts, progress, coach updates, and your training schedule in one place.</p><button onclick="go(\'My workouts\')">View my workouts</button></div><div class="grid"><div class="card"><div class="stat">'+data.workouts.filter(w=>w.client===1).length+'</div>Assigned workouts</div><div class="card"><div class="stat">'+data.workouts.filter(w=>w.client===1&&w.done).length+'</div>Completed sessions</div></div>';if(page==='My workouts')a='<h2>My training plan</h2>'+data.workouts.filter(w=>w.client===1).map(w=>'<div class="card"><span class="pill">'+esc(w.day)+'</span><h3>'+esc(w.name)+'</h3><p>'+esc(w.exercises)+'</p><button onclick="complete('+w.id+')">'+(w.done?'Undo completion':'Complete workout')+'</button></div>').join('');if(page==='Progress')a='<h2>Training progress</h2><div class="grid"><div class="card"><div class="stat">'+data.workouts.filter(w=>w.client===1&&w.done).length+'</div>Completed workouts</div><div class="card"><div class="stat">'+data.workouts.filter(w=>w.client===1).length+'</div>Assigned workouts</div></div><p class="muted">Exercise history, weights, and measurements will be connected to the full database.</p>';if(page==='Membership')a='<h2>Your membership</h2><div class="card"><h3>Coaching access</h3><p>Browse the app without paying. Your coach can activate services manually or invite you to checkout.</p><span class="pill">Demo access</span><p class="muted">No payment required for this preview.</p></div>';if(page==='Messages')a='<h2>Coaching messages</h2><div class="card">'+data.messages.map(m=>'<div class="row"><b>'+esc(m.who)+'</b><span>'+esc(m.text)+'</span></div>').join('')+'<form onsubmit="message(event)"><label>Message <input name="msg" required placeholder="Write a message"></label><button>Send demo message</button></form></div>';document.getElementById('app').innerHTML=a}render()</script></body></html>
