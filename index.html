<style>
:root{color-scheme:dark;--bg:#101512;--panel:#1a211d;--line:#303b33;--ink:#f0f3ee;--muted:#9ca99f;--accent:#c5e7a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid var(--line);position:sticky;top:0;background:#101512f5;z-index:5}.brand{font-weight:800;letter-spacing:.13em;font-size:20px}.brand span{color:var(--accent)}.hamb{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:7px 13px;font-size:23px}.topright{display:flex;align-items:center;gap:15px}.role{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:9px;border-radius:8px}aside{position:fixed;z-index:10;top:0;bottom:0;left:0;width:min(320px,88vw);background:#1a221d;border-right:1px solid var(--line);padding:26px;transform:translateX(-105%);transition:transform .22s;box-shadow:12px 0 50px #0008}aside.open{transform:translateX(0)}#shade{position:fixed;inset:0;background:#0009;z-index:9;display:none}#shade.open{display:block}aside .close{float:right;background:none;border:0;color:white;font-size:26px}aside h3{letter-spacing:.15em;font-size:12px;color:var(--muted);margin:48px 0 20px}aside nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd5cd;padding:15px;border-radius:9px;margin:3px 0}aside nav button.active,aside nav button:hover{background:#344537;color:#fff}main{max-width:1120px;margin:auto;padding:40px 5% 90px}.eyebrow{color:var(--accent);letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-weight:750}h1{font-size:clamp(32px,5vw,56px);letter-spacing:-.055em;line-height:1.08;margin:12px 0}h2{font-size:25px;letter-spacing:-.03em;margin:0 0 14px}h3{font-size:17px;margin:0 0 10px}p{color:var(--muted)}.lead{font-size:17px;max-width:660px}.hero{padding:32px 0 36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:24px;margin-bottom:16px}.card p{margin:7px 0}.card .big{font-size:30px;font-weight:700;color:var(--ink)}.btn{border:0;border-radius:9px;background:var(--accent);color:#142017;padding:12px 18px;font-weight:700}.btn.alt{background:#303c33;color:var(--ink)}.btn.ghost{background:transparent;color:var(--accent);border:1px solid #62765c}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.line{border-top:1px solid var(--line);padding:17px 0;display:flex;justify-content:space-between;align-items:center;gap:15px}.line:last-child{padding-bottom:0}.tag{font-size:12px;color:var(--accent);border:1px solid #56694e;padding:4px 9px;border-radius:50px;white-space:nowrap}.muted{color:var(--muted)}label{display:block;color:#c5cec6;font-size:13px;margin:16px 0 5px}input,select,textarea{width:100%;border:1px solid #465449;border-radius:9px;background:#121a15;color:white;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 18px}.section{margin:28px 0}.video{aspect-ratio:16/9;background:linear-gradient(135deg,#2e4434,#141e17);display:grid;place-items:center;border-radius:10px;margin-bottom:18px}.play{font-size:30px;border:1px solid #adc9aa;border-radius:50%;width:65px;height:65px;display:grid;place-items:center}.note{border-left:3px solid var(--accent);padding:13px 18px;background:#1b2b1e;color:#d7e8d5;border-radius:0 8px 8px 0;margin:18px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{padding:9px 14px;background:#202b23;color:#c5cec6;border:1px solid var(--line);border-radius:8px}.tabs button.active{background:var(--accent);color:#142017}.bar{height:8px;background:#334037;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}footer{text-align:center;color:#78897d;font-size:12px;padding:40px}@media(max-width:560px){header{padding:0 17px}main{padding:23px 17px 65px}.card{padding:19px}.role{max-width:130px}.line{align-items:flex-start}.hero{padding:20px 0}}
.tourmask{position:fixed;inset:0;background:#000b;z-index:20}.tourfocus{position:relative!important;z-index:22!important;box-shadow:0 0 0 5px #c5e7a5!important;border-radius:10px;background:#26382b!important}.tourbox{position:fixed;z-index:23;bottom:22px;left:50%;transform:translateX(-50%);width:min(450px,calc(100% - 28px));padding:23px;border-radius:15px;background:#d5ebc8;color:#142019;box-shadow:0 20px 80px #0009}.tourbox p{color:#314c37}.tourbox button{margin-right:8px}.feedbackvideo{width:100%;max-height:360px;border-radius:10px;background:#090e0b}.recording{color:#ffaaa0;font-weight:700}.demo-toolbar{min-height:67px;padding:12px max(18px,calc((100vw - 1200px)/2));background:#26382b;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid #52674d}.demo-meta{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.1em}.demo-dot{height:8px;width:8px;border-radius:50%;background:#b9ed9c}.demo-sub{color:#bacbbb;letter-spacing:0}.demo-switch{display:flex;padding:4px;background:#101b14;border:1px solid #536a50;border-radius:12px;gap:3px}.demo-switch button{border:0;background:transparent;color:#a7b9aa;border-radius:8px;padding:10px 22px;font-weight:700}.demo-switch button.selected{background:#c5e7a5;color:#142017}.app-header{top:0}.app-head-right{display:flex;align-items:center;gap:12px}.app-context{font-size:11px;color:#a8b6aa;letter-spacing:.12em}.avatar{width:36px;height:36px;display:grid;place-items:center;background:#334b39;border-radius:50%;color:#e1f2d8;font-weight:700}.demo-toolbar button:focus-visible,.hamb:focus-visible{outline:2px solid white;outline-offset:2px}@media(max-width:650px){.demo-toolbar{padding:10px 14px;gap:8px}.demo-meta{font-size:10px}.demo-sub{display:none}.demo-switch button{padding:9px 15px}.app-context{display:none}} .help-fab{position:fixed;right:20px;bottom:20px;z-index:18;border:1px solid #7b9b70;background:#c5e7a5;color:#132018;width:54px;height:54px;border-radius:50%;font-size:27px;font-weight:800;box-shadow:0 8px 30px #0008}.help-pop{position:fixed;right:20px;bottom:84px;z-index:18;width:min(310px,calc(100vw - 40px));background:#24342a;border:1px solid #64805c;border-radius:15px;padding:18px;box-shadow:0 15px 45px #0009}.help-pop button{width:100%;text-align:left;margin-top:8px}.tourbox{max-height:55vh;overflow-y:auto}.tourfocus{pointer-events:none}@media(max-width:600px){.help-fab{right:15px;bottom:15px}.help-pop{right:15px;bottom:78px}} </style></head><body>
<div class="demo-toolbar"><div class="demo-meta"><span class="demo-dot"></span><strong>INTERACTIVE DEMO</strong><span class="demo-sub">Choose an experience</span></div><div class="demo-switch" role="group" aria-label="Demo experience"><button id="trainer-switch" onclick="demoRole('coach')">Trainer</button><button id="client-switch" onclick="demoRole('athlete')">Client</button></div><select id="role" aria-label="Current demo role" hidden><option value="coach">Trainer</option><option value="athlete">Client</option></select></div><header class="app-header"><div class="topright"><button class="hamb" aria-label="Open navigation" onclick="drawer(true)">☰</button><div class="brand">FORM<span>.</span></div></div><div class="app-head-right"><span class="app-context" id="context-label">TRAINER WORKSPACE</span><div class="avatar" id="avatar">T</div></div></header>
<div id="shade" onclick="drawer(false)"></div><aside id="drawer"><button class="close" aria-label="Close navigation" onclick="drawer(false)">×</button><div class="brand">FORM<span>.</span></div><h3 id="navtitle">COACH WORKSPACE</h3><nav id="nav"></nav><p style="margin-top:40px;font-size:12px">A focused coaching workspace.<br>Sample data only.</p></aside><main id="app"></main><div id="tourroot"></div><div id="help-root"></div><footer>FORM COACHING · PRODUCT CONCEPT · NO LIVE BILLING OR ACCOUNTS</footer>
<script>
const initial={clients:[{id:1,name:'Alex Morgan',goal:'Build strength',email:'alex@example.test',training:'4 sessions / week',nutrition:'Protein target: 150g / day',habits:'8,000 steps · 7h sleep',notes:'Working on consistency and progressive overload.'},{id:2,name:'Jordan Lee',goal:'Improve conditioning',email:'jordan@example.test',training:'3 sessions / week',nutrition:'Regular meals, hydration',habits:'Daily walk · Morning routine',notes:'Returning to structured training.'},{id:3,name:'Taylor Brooks',goal:'General fitness',email:'taylor@example.test',training:'2 sessions / week',nutrition:'Increase fruit and vegetables',habits:'Sleep schedule · Weekly meal prep',notes:'New athlete — onboarding pending.'}],checkins:[{id:1,client:1,date:'2026-11-23',weight:'175',sleep:'7',energy:'4',training:'4 of 4',nutrition:'Mostly on plan',wins:'Improved bench press',challenges:'Late meetings',feedback:'Strong week. Keep recovery consistent.'}],onboarding:[],videos:[{id:1,title:'Getting started with your coaching plan',category:'Orientation',description:'How to navigate your plan and what to expect from coaching.'},{id:2,title:'Reading your training sheet',category:'Training',description:'Sets, reps, load, rest periods and logging your sessions.'},{id:3,title:'Nutrition and daily habits',category:'Nutrition',description:'Understanding your targets and habit tracking.'},{id:4,title:'Submitting your weekly check-in',category:'Check-ins',description:'What to report and how coach feedback works.'}]};
let db;try{db=JSON.parse(localStorage.getItem('form-coaching-v2'))||structuredClone(initial)}catch{db=JSON.parse(JSON.stringify(initial))}let page='Welcome',selected=1,sheet='Training',video=1;let welcomeDone=sessionStorage.getItem('form-entered')==='yes';let intakeStep=0;let intakeDraft={};let tourMode='coach';let helpOpen=false;let initialTourPending=!localStorage.getItem('form-tour-demo-seen');let tourStep=-1,recorder=null,chunks=[],recordedBlob=null;db.responses=db.responses||{};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{localStorage.setItem('form-coaching-v2',JSON.stringify(db));render()},coach=()=>$('role').value==='coach';
function drawer(open){$('drawer').classList.toggle('open',open);$('shade').classList.toggle('open',open)}
function navTo(p){page=p;drawer(false);render()}function switchRole(){endTour();page=welcomeDone?(coach()?'Overview':'My plan'):'Welcome';render()}function demoRole(role){endTour(false);$('role').value=role;welcomeDone=true;sessionStorage.setItem('form-entered','yes');page=role==='coach'?'Overview':'My plan';render();if(!localStorage.getItem('form-tour-'+role+'-seen'))setTimeout(()=>startTour(role==='coach'?'coach':'athlete'),150)}
function button(label,fn,cls='alt'){return '<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>'}
function heading(k,t,desc){return '<div class="hero"><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="lead">'+desc+'</p></div>'}
function client(){return db.clients.find(c=>c.id===selected)||db.clients[0]}
function clients(){return heading('01 / CLIENT SHEETS','Your clients. In detail.','Training, nutrition and habits together in a single, editable client record.')+'<div class="card"><h3>Select a client</h3><select onchange="selected=Number(this.value);render()">'+db.clients.map(c=>'<option value="'+c.id+'" '+(selected===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+sheetView()+'<div class="card"><h3>Add a client</h3><form onsubmit="addAthlete(event)"><div class="formgrid"><div><label>Name</label><input name="name" required></div><div><label>Email</label><input name="email" type="email" required></div></div><button class="btn" style="margin-top:16px">Add client</button></form></div>'}
function sheetView(){let c=client();return '<div class="card"><div class="eyebrow">CLIENT RECORD</div><h2>'+esc(c.name)+'</h2><p>'+esc(c.goal)+' · '+esc(c.email)+'</p><div class="tabs">'+['Training','Nutrition','Habits','Notes'].map(t=>'<button class="'+(sheet===t?'active':'')+'" onclick="sheet=\''+t+'\';render()">'+t+'</button>').join('')+'</div><form onsubmit="updateSheet(event)"><label>'+sheet+' sheet</label><textarea name="value" rows="6">'+esc(c[sheet.toLowerCase()])+'</textarea><div class="actions"><button class="btn">Save '+sheet.toLowerCase()+'</button></div></form></div>'}
function addAthlete(e){e.preventDefault();let f=new FormData(e.target);let id=Date.now();db.clients.push({id,name:f.get('name'),email:f.get('email'),goal:'New athlete',training:'',nutrition:'',habits:'',notes:''});selected=id;save()}
function updateSheet(e){e.preventDefault();client()[sheet.toLowerCase()]=new FormData(e.target).get('value');save()}
function legacyOnboarding(){return heading('02 / ONBOARDING','Start with the whole picture.','A structured intake that gives the coach the context to build an individual plan.')+'<form class="card" onsubmit="submitOnboarding(event)"><h2>Athlete intake</h2><div class="formgrid"><div><label>Full name</label><input name="name" required></div><div><label>Email</label><input name="email" type="email" required></div><div><label>Primary training goal</label><select name="goal"><option>Build strength</option><option>Fat loss</option><option>Improve conditioning</option><option>General health</option><option>Sport performance</option></select></div><div><label>Training experience</label><select name="experience"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div><label>Days available per week</label><select name="days"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div><label>Typical sleep per night</label><select name="sleep"><option>Under 6 hours</option><option>6–7 hours</option><option>7–8 hours</option><option>8+ hours</option></select></div></div><label>Equipment and gym access</label><textarea name="equipment" placeholder="Gym, home equipment, travel constraints…"></textarea><label>Current nutrition approach</label><textarea name="nutrition" placeholder="Eating pattern, preferences, challenges…"></textarea><label>Injuries, limitations, or anything your coach should consider</label><textarea name="limitations" placeholder="Only share what is relevant to safe training."></textarea><label>What has made consistency difficult?</label><textarea name="barriers"></textarea><div class="actions"><button class="btn">Submit intake</button></div></form>'+(coach()?'<div class="card"><h3>Recent intake submissions</h3>'+ (db.onboarding.length?db.onboarding.map(o=>'<div class="line"><div><b>'+esc(o.name)+'</b><p>'+esc(o.goal)+' · '+esc(o.days)+' days/week</p></div><span class="tag">Received</span></div>').join(''):'<p>No submitted questionnaires yet.</p>')+'</div>':'')}
function submitOnboarding(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=Date.now();db.onboarding.unshift(o);save();alert('Demo questionnaire saved on this device.')}
function responseUI(c){let x=db.responses[c.id];if(!x)return '<p class="muted">No video response yet.</p>';return '<div class="section"><div class="eyebrow">PERSONAL VIDEO RESPONSE</div>'+(x.video?'<video class="feedbackvideo" controls src="'+x.video+'"></video>':'<p class="muted">Video not saved yet</p>')+'<p>'+esc(x.note||'')+'</p></div>'}
function videoResponse(id){let c=db.checkins.find(x=>x.id===id);let x=db.responses[id]||{};let note=prompt('Optional written coaching notes',x.note||'');if(note!==null){db.responses[id]={...x,note};save()} }
function uploadResponse(id,input){let f=input.files[0];if(!f)return;if(f.size>3000000){alert('This local demo can only save very small clips (under 3 MB). Production will use private cloud video storage.');return}let reader=new FileReader();reader.onload=()=>{db.responses[id]={...(db.responses[id]||{}),video:reader.result};try{save()}catch{alert('Browser storage is full. A production backend is needed for larger videos.')}};reader.readAsDataURL(f)}
async function recordResponse(id){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('Camera recording requires HTTPS and a supported browser.');return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:recorder.mimeType});if(blob.size>3000000){alert('Recording too large for local demo storage. Try a shorter clip.');return}let f=new FileReader();f.onload=()=>{db.responses[id]={...(db.responses[id]||{}),video:f.result};try{save()}catch{alert('Not enough local storage for the recording.')}};f.readAsDataURL(blob)};recorder.start();let b=document.getElementById('record-'+id);if(b){b.textContent='Stop recording';b.onclick=()=>{if(recorder?.state==='recording')recorder.stop()}}}catch(e){alert('Camera permission unavailable: '+e.message)}}
function checkins(){return heading('03 / WEEKLY CHECK-INS','The feedback loop.','Athletes report what happened. Coaches respond with context and adjustments.')+'<div class="grid"><div class="card"><h2>Submit a check-in</h2><form onsubmit="submitCheckin(event)">'+(coach()?'<label>Athlete</label><select name="client">'+db.clients.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select>':'<input type="hidden" name="client" value="1">')+'<div class="formgrid"><div><label>Weight (optional, lb)</label><input name="weight" type="number" step=".1"></div><div><label>Average sleep (hours)</label><input name="sleep" type="number" min="0" max="24" step=".5"></div><div><label>Energy (1–5)</label><select name="energy">'+[1,2,3,4,5].map(n=>'<option>'+n+'</option>').join('')+'</select></div><div><label>Training sessions completed</label><input name="training" placeholder="3 of 4"></div></div><label>Nutrition adherence</label><textarea name="nutrition" placeholder="How did nutrition go?"></textarea><label>Wins this week</label><textarea name="wins"></textarea><label>Challenges / questions</label><textarea name="challenges"></textarea><button class="btn">Submit check-in</button></form></div><div class="card"><h2>Check-in history</h2>'+db.checkins.map(c=>'<div class="line"><div><b>'+esc(db.clients.find(x=>x.id===Number(c.client))?.name||'Athlete')+'</b><div class="muted">'+esc(c.date)+' · Training '+esc(c.training)+'</div><p>Win: '+esc(c.wins)+'</p><p>Coach: '+esc(c.feedback||'Awaiting feedback')+'</p>'+(coach()?'<div class="actions"><button class="btn ghost" onclick="feedback('+c.id+')">Written feedback</button><button class="btn ghost" onclick="videoResponse('+c.id+')">Video notes</button><button class="btn ghost" id="record-'+c.id+'" onclick="recordResponse('+c.id+')">Record video</button></div><label>Or upload a response video (small demo clips)</label><input type="file" accept="video/*" onchange="uploadResponse('+c.id+',this)"> </div>':'')+responseUI(c)+'</div></div>').join('')+'</div></div>'}
function submitCheckin(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.id=Date.now();v.date=new Date().toISOString().slice(0,10);v.feedback='';db.checkins.unshift(v);save()}
function feedback(id){let v=prompt('Coach feedback');if(v!==null){db.checkins.find(c=>c.id===id).feedback=v;save()}}
function videos(){return heading('04 / VIDEO GUIDES','Show, don’t just tell.','A guided library for every part of the coaching experience.')+'<div class="note">These are video lesson placeholders. The trainer’s actual walkthrough videos can be embedded here when available; no stock videos are presented as his content.</div><div class="grid">'+db.videos.map(v=>'<div class="card"><div class="video"><div class="play">▶</div></div><div class="eyebrow">'+esc(v.category)+'</div><h3>'+esc(v.title)+'</h3><p>'+esc(v.description)+'</p>'+button('View lesson details','showVideo('+v.id+')','ghost')+'</div>').join('')+'</div>'}
function showVideo(id){let v=db.videos.find(v=>v.id===id);alert(v.title+'\n\n'+v.description+'\n\nVideo upload/embed will be enabled when real trainer content is supplied.')}
function overview(){return heading('PERSONAL COACHING / ONE PLACE','Better coaching starts with clarity.','A single workspace for athlete records, onboarding, weekly feedback and guided resources.')+'<div class="grid">'+[['Client sheets','Training, nutrition, habits and notes.','Clients'],['Onboarding','A complete intake before the first session.','Onboarding'],['Check-ins','Weekly reporting and coach feedback.','Check-ins'],['Video guides','A library that explains the process.','Video guides']].map(([a,b,c],i)=>'<div class="card"><div class="eyebrow">0'+(i+1)+'</div><h2 style="margin-top:12px">'+a+'</h2><p>'+b+'</p><div class="actions">'+button('Open '+a,'navTo(\''+c+'\')','ghost')+'</div></div>').join('')+'</div><div class="note">Demo data is stored only in this browser. Real client access, file imports, and video hosting require a backend.</div>'}
function myPlan(){selected=1;return heading('YOUR COACHING SPACE','Good to see you, Alex.','Your plan, habits and weekly progress in one place.')+'<div class="grid">'+[['Training',client().training],['Nutrition',client().nutrition],['Habits',client().habits]].map(([t,v])=>'<div class="card"><div class="eyebrow">'+t+'</div><h2 style="margin-top:15px">'+esc(v)+'</h2></div>').join('')+'</div><div class="actions">'+button('Complete weekly check-in',"navTo('Check-ins')")+' '+button('Watch video guides',"navTo('Video guides')",'ghost')+'</div>'}
const demoTourSteps=[{page:'Welcome',target:'.demo-switch',title:'Explore both experiences',body:'Use Trainer and Client at the top to switch between two complete views of the same coaching app.'},{page:'Welcome',target:'.hamb',title:'Open the app menu',body:'The hamburger opens navigation for the current role. The client and trainer see different tools.'},{page:'Welcome',target:'.help-fab',title:'Help is always here',body:'Tap the question mark anytime to replay the demo tour or launch the tutorial for the current role.'}];const clientTourSteps=[{page:'My plan',target:'.grid .card',title:'Your personal plan',body:'Your training, nutrition and habits live here.'},{page:'Check-ins',target:'form',title:'Your weekly check-in',body:'Tell your coach how the week went. Personal video responses appear with your check-in history.'},{page:'Video guides',target:'.grid .card',title:'Learn at your pace',body:'Watch shared coaching walkthroughs whenever you need them.'}];const tourSteps=[{page:'Overview',target:'.hamb',title:'Navigation',body:'Use this menu to move between client sheets, onboarding, check-ins and video guides.'},{page:'Clients',target:'.card select',title:'Client sheets',body:'Each athlete has individual training, nutrition, habits and coach notes.'},{page:'Onboarding',target:'form.card',title:'Athlete onboarding',body:'A structured questionnaire captures goals, experience and constraints.'},{page:'Check-ins',target:'form',title:'Weekly check-ins',body:'Athletes submit progress; coaches attach private recorded or uploaded video feedback.'},{page:'Video guides',target:'.grid .card',title:'Reusable video guides',body:'Static walkthroughs are shared with all athletes. Personalized check-in videos are separate.'}];
function startTour(mode){helpOpen=false;tourStep=0;tourMode=mode||'coach';if(tourMode==='coach')$('role').value='coach';else $('role').value='athlete';showTour()}
function endTour(mark=true){if(mark&&tourStep>=0)localStorage.setItem('form-tour-'+tourMode+'-seen','yes');tourStep=-1;$('tourroot').innerHTML='';document.querySelectorAll('.tourfocus').forEach(e=>e.classList.remove('tourfocus'))}
function advanceTour(n){tourStep+=n;if(tourStep<0||tourStep>=(tourMode==='demo'?demoTourSteps:tourMode==='athlete'?clientTourSteps:tourSteps).length){endTour();return}showTour()}
function showTour(){if(tourStep<0)return;let steps=tourMode==='athlete'?clientTourSteps:tourSteps;if(tourStep>=steps.length){endTour();return}let t=steps[tourStep];page=t.page;render();document.querySelectorAll('.tourfocus').forEach(e=>e.classList.remove('tourfocus'));let el=document.querySelector(t.target);if(el){el.classList.add('tourfocus');el.scrollIntoView({block:'center',behavior:'smooth'})}$('tourroot').innerHTML='<div class="tourmask"></div><div class="tourbox" role="dialog" aria-modal="true"><div class="eyebrow">GUIDED TOUR · '+(tourStep+1)+' / '+(tourMode==='athlete'?clientTourSteps:tourSteps).length+'</div><h2>'+t.title+'</h2><p>'+t.body+'</p><div class="actions"><button class="btn alt" onclick="advanceTour(-1)">Back</button><button class="btn" onclick="advanceTour(1)">'+(tourStep===(tourMode==='athlete'?clientTourSteps:tourSteps).length-1?'Finish':'Next')+'</button><button class="btn alt" onclick="endTour()">Skip</button></div></div>'}

function enter(role){demoRole(role)}
function beginIntake(){welcomeDone=true;sessionStorage.setItem('form-entered','yes');$('role').value='athlete';page='Onboarding';intakeStep=0;intakeDraft={};render()}
function welcome(){return '<div class="hero" style="padding-top:8vh;max-width:760px"><div class="eyebrow">PERSONAL COACHING, MADE PERSONAL</div><h1>Your coaching.<br>One place.</h1><p class="lead">Training, nutrition, habits, weekly check-ins and direct video feedback from your coach. Everything you need to stay on track.</p><div class="actions">'+button('Get started','beginIntake()')+' '+button('Explore as a client',"enter('athlete')",'ghost')+'</div></div><div class="grid"><div class="card"><div class="eyebrow">FOR CLIENTS</div><h2>Your plan, made for you.</h2><p>Check your training, submit weekly updates and watch your coach’s personal feedback.</p>'+button('Client preview',"enter('athlete')",'alt')+'</div><div class="card"><div class="eyebrow">FOR COACHES</div><h2>Stay close to every client.</h2><p>Manage individual plans, review check-ins and respond with video.</p>'+button('Coach preview',"enter('coach')",'alt')+'</div></div><div class="card"><div class="eyebrow">NEW HERE?</div><h2>See how it works</h2><p>Follow a guided walkthrough of the coaching experience.</p>'+button('Start guided tour','welcomeTour()','ghost')+'</div>'}
function welcomeTour(){startTour('demo')}
const intakeFields=[
{title:'Tell us about yourself',desc:'Start with the basics so your coach knows who you are.',fields:[['Full name','name','text'],['Email address','email','email']]},
{title:'What are you working toward?',desc:'Your goals shape your coaching plan.',fields:[['Primary training goal','goal','select','Build strength|Fat loss|Improve conditioning|General health|Sport performance'],['Training experience','experience','select','Beginner|Intermediate|Advanced'],['Training days per week','days','select','2|3|4|5|6']]},
{title:'Your routine',desc:'A plan should fit your actual life.',fields:[['Equipment and gym access','equipment','textarea'],['Current nutrition approach','nutrition','textarea'],['Typical sleep','sleep','select','Under 6 hours|6–7 hours|7–8 hours|8+ hours']]},
{title:'Anything else your coach should know?',desc:'Share what matters to your training.',fields:[['Injuries or limitations','limitations','textarea'],['What makes consistency difficult?','barriers','textarea']]}
];
function onboarding(){let t=intakeFields[intakeStep];return heading('CLIENT ONBOARDING','Let’s get to know you.','A short guided intake, one step at a time.')+'<div class="card"><div class="eyebrow">STEP '+(intakeStep+1)+' OF '+intakeFields.length+'</div><div class="bar" style="margin:14px 0 25px"><i style="width:'+((intakeStep+1)/intakeFields.length*100)+'%"></i></div><h2>'+t.title+'</h2><p>'+t.desc+'</p><form onsubmit="nextIntake(event)">'+t.fields.map(([label,name,type,options])=>'<label>'+label+'</label>'+(type==='textarea'?'<textarea name="'+name+'">'+esc(intakeDraft[name]||'')+'</textarea>':type==='select'?'<select name="'+name+'">'+options.split('|').map(o=>'<option '+(intakeDraft[name]===o?'selected':'')+'>'+o+'</option>').join('')+'</select>':'<input name="'+name+'" type="'+type+'" value="'+esc(intakeDraft[name]||'')+'" '+(name==='name'||name==='email'?'required':'')+'>')).join('')+'<div class="actions">'+(intakeStep?button('Back','backIntake()','alt'):'')+'<button class="btn" type="submit">'+(intakeStep===intakeFields.length-1?'Finish onboarding':'Continue')+'</button></div></form></div>'}
function nextIntake(e){e.preventDefault();Object.assign(intakeDraft,Object.fromEntries(new FormData(e.target)));if(intakeStep<intakeFields.length-1){intakeStep++;render()}else{db.onboarding.unshift({...intakeDraft,id:Date.now()});save();page='Onboarding complete';render()}}
function backIntake(){intakeStep=Math.max(0,intakeStep-1);render()}
function onboardingComplete(){return heading('YOU’RE ALL SET','Welcome to your coaching space.','Your intake is saved in this demo. Next, explore your plan and learn how to use the app.')+'<div class="card"><h2>Start with a quick tour</h2><p>We’ll show you where to find your training, check-ins and video feedback.</p><div class="actions">'+button('Take the tour','clientTour()')+' '+button('Go to my plan',"navTo('My plan')",'ghost')+'</div></div>'}
function clientTour(){page='My plan';startTour('athlete')}
function render(){document.getElementById('trainer-switch').classList.toggle('selected',coach());document.getElementById('client-switch').classList.toggle('selected',!coach());document.getElementById('context-label').textContent=coach()?'TRAINER WORKSPACE':'CLIENT WORKSPACE';document.getElementById('avatar').textContent=coach()?'T':'C';if(!welcomeDone&&page!=='Onboarding'&&page!=='Onboarding complete')page='Welcome';let pages=coach()?['Overview','Clients','Onboarding','Check-ins','Video guides','Welcome']:['My plan','Onboarding','Check-ins','Video guides','Welcome','Onboarding complete'];if(!pages.includes(page))page=pages[0];$('navtitle').textContent=coach()?'COACH WORKSPACE':'ATHLETE WORKSPACE';$('nav').innerHTML=pages.map(p=>'<button class="'+(p===page?'active':'')+'" onclick="navTo(\''+p+'\')">'+p+'</button>').join('');$('app').innerHTML=({Welcome:welcome,'Onboarding complete':onboardingComplete,Overview:overview,Clients:clients,Onboarding:onboarding,'Check-ins':checkins,'Video guides':videos,'My plan':myPlan,Tutorial:()=>''}[page])();renderHelp()}function renderHelp(){$('help-root').innerHTML='<button class="help-fab" aria-label="Help and tutorials" aria-expanded="'+helpOpen+'" onclick="helpOpen=!helpOpen;renderHelp()">?</button>'+(helpOpen?'<div class="help-pop"><h3>Need a hand?</h3><p>Choose a walkthrough.</p><button class="btn alt" onclick="startTour(\'demo\')">Tour the demo</button><button class="btn alt" onclick="startTour(\''+(coach()?'coach':'athlete')+'\')">'+(coach()?'Trainer':'Client')+' app tutorial</button><button class="btn ghost" onclick="helpOpen=false;renderHelp()">Close</button></div>':'')}render();if(initialTourPending){initialTourPending=false;setTimeout(()=>{if(!localStorage.getItem('form-tour-demo-seen'))startTour('demo')},350)}
</script></body></html>
